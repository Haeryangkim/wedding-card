# 모바일 청첩장 플랫폼: 정적 SPA 서빙 + api 컨테이너 프록시
#   /api/      REST + SSE(청첩장별 방명록 실시간)
#   /uploads/  업로드된 사진
#   /w/        청첩장 페이지 — api 가 index.html 에 그 청첩장의 OG 태그를 넣어 응답(링크 미리보기),
#              /w/<slug>/wedding.ics 캘린더
#   그 외      SPA 셸(index.html): /, /new 등

# IP별 동시 연결 상한(이 파일은 http 컨텍스트에 include 된다).
# SSE 스트림 하나가 클라이언트+업스트림 연결 2개를 오래 붙잡으므로 한 주소가
# worker_connections 를 고갈시키지 못하게 한다. 통신사 CGNAT 로 하객 여러 명이
# 한 주소를 쓰는 경우가 많아 값은 넉넉하게 둔다.
#
# 주의: 이 상한과 api 의 IP별 한도(청첩장 만들기·로그인 실패·SSE·장소 검색·사진 업로드)는 nginx 가
# "실제 클라이언트 주소"를 볼 때만 방문자를 구분한다 = rootful Linux Docker + IPv4(DNAT).
# 다음 환경에서는 모든 연결이 브리지 게이트웨이 주소 하나로 들어와 한도가 서비스 전체에 걸린다:
#   - Docker Desktop (macOS/Windows)
#   - rootless Docker (기본 포트 드라이버)
#   - 공개 포트로 들어오는 IPv6 (userland proxy 경유)
# 이때는 전달된 헤더가 없어 아래 real_ip 설정만으로는 복원할 수 없다. 대책은 README 의 "TRUST_PROXY 주의".
limit_conn_zone $binary_remote_addr zone=perip:1m;

# 이 컨테이너 앞에 호스트 리버스 프록시/TLS 종단이 있으면 아래를 켜서 $remote_addr 를
# 실제 클라이언트 주소로 복원한다(안 그러면 모든 하객이 한 IP 로 묶인다).
# set_real_ip_from 에는 nginx 가 실제로 보는 앞단 주소 대역을 넣는다(`docker compose logs web` 의 접속 로그로 확인).
# Docker Desktop 의 게이트웨이는 192.168.65.0/24 처럼 아래 예시 밖일 수 있다.
#   set_real_ip_from  172.16.0.0/12;   # 앞단 프록시 대역
#   real_ip_header    X-Forwarded-For;
#   real_ip_recursive on;
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # 사진 업로드(장당 최대 2MB, api 가 다시 검사)에 맞춘 본문 상한. JSON 요청은 api 가 훨씬 작게 제한한다.
    client_max_body_size 3m;

    limit_conn           perip 200;
    limit_conn_status    429;

    # 압축
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml text/calendar application/manifest+json;

    # 전역 보안 헤더 (add_header 를 쓰는 location 에서는 상속되지 않으므로 아래에서 다시 선언)
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # ---- api 프록시 공통 설정 (아래 프록시 location 들이 상속) ----
    # 변수 + resolver 로 api 컨테이너 재시작/지연에도 견딘다.
    resolver                127.0.0.11 valid=30s ipv6=off;
    proxy_http_version      1.1;
    # $http_host: 포트까지 포함한 원래 Host → api 가 절대 URL(og:url 등)을 만들 때 쓴다.
    # (운영에서는 PUBLIC_ORIGIN 을 설정하면 이 값과 무관하게 고정된다)
    proxy_set_header        Host              $http_host;
    proxy_set_header        X-Forwarded-Host  $http_host;
    proxy_set_header        X-Real-IP         $remote_addr;
    # 덧붙이지($proxy_add_x_forwarded_for) 않고 덮어쓴다: 클라이언트가 보낸
    # X-Forwarded-For 로 레이트리밋 키를 위조하지 못하게 한다.
    proxy_set_header        X-Forwarded-For   $remote_addr;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_set_header        Connection        "";
    # 같은 헤더는 위 add_header 가 한 번만 붙인다(api 가 보낸 것과 겹치지 않게).
    proxy_hide_header       X-Content-Type-Options;
    proxy_hide_header       X-Frame-Options;
    proxy_hide_header       Referrer-Policy;

    # REST API (응답은 버퍼링하지 않고 바로 전달)
    location /api/ {
        set                     $api_upstream http://api:8787;
        proxy_pass              $api_upstream$request_uri;

        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      60s;
        proxy_send_timeout      60s;
    }

    # SSE(GET /api/weddings/<slug>/events): 버퍼링을 끄고 오래 유지한다.
    # 연결을 오래 붙잡으므로 IP별 동시 스트림을 더 빡빡하게 제한한다.
    # (초과분은 429 → 웹 클라이언트가 폴링으로 내려간다)
    location ~ ^/api/weddings/[^/]+/events$ {
        limit_conn              perip 30;
        limit_conn_status       429;

        set                     $api_upstream http://api:8787;
        proxy_pass              $api_upstream$request_uri;

        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        chunked_transfer_encoding off;
    }

    # 업로드된 사진. 파일 이름이 무작위라 api 가 "immutable" 장기 캐시 헤더를 붙여 준다.
    location /uploads/ {
        set                     $api_upstream http://api:8787;
        proxy_pass              $api_upstream$request_uri;
        proxy_read_timeout      30s;
    }

    # 청첩장 페이지(/w/<slug>, /w/<slug>/edit)와 캘린더(/w/<slug>/wedding.ics).
    # api 가 내려가 있으면(502/504) 미리보기 태그는 못 넣어도 SPA 셸은 보여 준다.
    location /w/ {
        set                     $api_upstream http://api:8787;
        proxy_pass              $api_upstream$request_uri;
        proxy_connect_timeout   3s;
        proxy_read_timeout      15s;
        error_page              502 504 =200 /index.html;
    }

    # (데모용) 빌드 시 만들어지는 캘린더 파일은 반드시 text/calendar 로 (이 location 안에서만 mime 재정의).
    # .ics 는 RFC 5545 상 기본 UTF-8 이므로 charset 은 생략한다.
    location = /wedding.ics {
        types { }
        default_type text/calendar;
        add_header Cache-Control            "public, max-age=3600"           always;
        add_header X-Content-Type-Options   "nosniff"                        always;
        add_header X-Frame-Options          "SAMEORIGIN"                     always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # 해시가 붙은 정적 자산은 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control            "public, immutable"              always;
        add_header X-Content-Type-Options   "nosniff"                        always;
        add_header X-Frame-Options          "SAMEORIGIN"                     always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # index.html 은 캐시하지 않아 재배포가 바로 반영되게 (api 도 여기서 템플릿을 가져간다)
    location = /index.html {
        add_header Cache-Control            "no-cache"                       always;
        add_header X-Content-Type-Options   "nosniff"                        always;
        add_header X-Frame-Options          "SAMEORIGIN"                     always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # SPA: 파일이 아닌 경로(/, /new 등)는 index.html 셸로 → 프론트 라우터가 처리
    location / {
        try_files $uri /index.html;
    }
}
