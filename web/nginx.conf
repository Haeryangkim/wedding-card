# 모바일 청첩장 정적 서빙 + /api 프록시 (SSE 안전)

# IP별 동시 연결 상한(이 파일은 http 컨텍스트에 include 된다).
# SSE 스트림 하나가 클라이언트+업스트림 연결 2개를 오래 붙잡으므로 한 주소가
# worker_connections 를 고갈시키지 못하게 한다. 통신사 CGNAT 로 하객 여러 명이
# 한 주소를 쓰는 경우가 많아 값은 넉넉하게 둔다.
limit_conn_zone $binary_remote_addr zone=perip:1m;

# 이 컨테이너 앞에 호스트 리버스 프록시/TLS 종단이 있으면 아래를 켜서 $remote_addr 를
# 실제 클라이언트 주소로 복원한다(안 그러면 모든 하객이 한 IP 로 묶인다).
#   set_real_ip_from  172.16.0.0/12;   # 앞단 프록시 대역
#   real_ip_header    X-Forwarded-For;
#   real_ip_recursive on;
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    client_max_body_size 1m;

    limit_conn           perip 200;
    limit_conn_status    429;

    # 압축
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml text/calendar application/manifest+json;

    # 전역 보안 헤더 (add_header 를 쓰는 location 에서는 상속되지 않으므로 아래에서 다시 선언)
    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "SAMEORIGIN"                     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    # 방명록 API 프록시. 변수 + resolver 로 api 컨테이너 재시작/지연에도 견딘다.
    location /api/ {
        resolver                127.0.0.11 valid=30s ipv6=off;
        set                     $api_upstream http://api:8787;
        proxy_pass              $api_upstream$request_uri;

        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        # 덧붙이지($proxy_add_x_forwarded_for) 않고 덮어쓴다: 클라이언트가 보낸
        # X-Forwarded-For 로 레이트리밋 키를 위조하지 못하게 한다.
        proxy_set_header        X-Forwarded-For   $remote_addr;
        proxy_set_header        X-Forwarded-Proto $scheme;

        # SSE(GET /api/events) 안전 설정: 버퍼링 끄고 오래 유지
        proxy_set_header        Connection        "";
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        chunked_transfer_encoding off;
    }

    # SSE 는 연결을 오래 붙잡으므로 IP별 동시 스트림을 더 빡빡하게 제한한다.
    # (초과분은 429 → 웹 클라이언트가 폴링으로 내려간다)
    location = /api/events {
        limit_conn              perip 30;
        limit_conn_status       429;

        resolver                127.0.0.11 valid=30s ipv6=off;
        set                     $api_upstream http://api:8787;
        proxy_pass              $api_upstream$request_uri;

        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $remote_addr;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_set_header        Connection        "";
        proxy_buffering         off;
        proxy_cache             off;
        proxy_read_timeout      1h;
        proxy_send_timeout      1h;
        chunked_transfer_encoding off;
    }

    # 캘린더 파일은 반드시 text/calendar 로 (이 location 안에서만 mime 재정의).
    # .ics 는 RFC 5545 상 기본 UTF-8 이므로 charset 은 생략한다.
    location = /wedding.ics {
        types { }
        default_type text/calendar;
        add_header Cache-Control            "public, max-age=3600"           always;
        add_header X-Content-Type-Options   "nosniff"                        always;
        add_header X-Frame-Options          "SAMEORIGIN"                     always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # 해시가 붙은 정적 자산은 오래 캐시
    location /assets/ {
        expires 1y;
        add_header Cache-Control            "public, immutable"              always;
        add_header X-Content-Type-Options   "nosniff"                        always;
        add_header X-Frame-Options          "SAMEORIGIN"                     always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # index.html 은 캐시하지 않아 재배포가 바로 반영되게
    location = /index.html {
        add_header Cache-Control            "no-cache"                       always;
        add_header X-Content-Type-Options   "nosniff"                        always;
        add_header X-Frame-Options          "SAMEORIGIN"                     always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    }

    # 단일 페이지(클라이언트 라우팅 없음): 없는 경로는 index.html 로
    location / {
        try_files $uri /index.html;
    }
}
