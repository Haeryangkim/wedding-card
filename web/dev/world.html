<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>WorldCanvas Dev Harness</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper, #faf6ef);
        color: var(--ink, #3b332b);
        font-family: var(--font-sans, system-ui, sans-serif);
      }
      .harness {
        max-width: 430px;
        margin: 0 auto;
        padding: 12px 16px calc(32px + env(safe-area-inset-bottom));
        min-height: 100vh;
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
        padding: 8px 0;
        background: var(--paper, #faf6ef);
      }
      .bar strong {
        font-size: 14px;
      }
      .bar .count {
        font-size: 12px;
        color: var(--ink-soft, #7a6f63);
        margin-right: auto;
      }
      .bar button {
        min-width: 40px;
        min-height: 36px;
        padding: 6px 10px;
        border: 1px solid var(--line, #e6dccb);
        border-radius: 10px;
        background: var(--card, #fffdf8);
        color: var(--ink, #3b332b);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .bar button:active {
        background: var(--paper-2, #f3ecdf);
      }
      .stage {
        margin-top: 8px;
      }
      .sel {
        margin: 12px 2px 0;
        font-size: 13px;
        color: var(--ink-soft, #7a6f63);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/dev/world.tsx"></script>
  </body>
</html>
