<!doctype html>
<!--
  nemo 그림체 확인용 페이지 — build.py 가 index.ts 를 nemo.bundle.js(IIFE, 전역 Nemo)로 묶어 이 파일 옆에 두고 헤드리스 Chrome 으로 찍는다.
  #preview : 파츠 견본 (art/nemo/preview.png)
  #walk    : 신랑·신부·하객 6명 x 4방향 x 3프레임 — 크게 + 지도 크기 (walk.png)
  #strip   : 걷기 4박자(1,0,2,0)를 세로로 쌓은 띠 — build.py 가 잘라 walk.gif 로 만든다
-->
<meta charset="utf-8" />
<style>
  html, body { margin: 0; background: #f6f1e7; }
  canvas { display: block; }
</style>
<canvas id="c"></canvas>
<script src="nemo.bundle.js"></script>
<script>
  const N = Nemo
  const DIRS = ['down', 'left', 'right', 'up']
  const WALK = [1, 0, 2, 0]
  const GUESTS = [
    { skin: 1, hairStyle: 0, hairColor: 1, outfit: 2, outfitColor: 0, accessory: 0 },
    { skin: 0, hairStyle: 9, hairColor: 2, outfit: 4, outfitColor: 7, accessory: 3 },
    { skin: 3, hairStyle: 6, hairColor: 0, outfit: 7, outfitColor: 2, accessory: 1 },
    { skin: 2, hairStyle: 10, hairColor: 0, outfit: 9, outfitColor: 5, accessory: 4 },
    { skin: 5, hairStyle: 3, hairColor: 0, outfit: 8, outfitColor: 8, accessory: 6 },
    { skin: 1, hairStyle: 12, hairColor: 3, outfit: 6, outfitColor: 3, accessory: 5 },
  ]
  const CAST = ['groom', 'bride', ...GUESTS]
  const NAMES = ['신랑', '신부', '하객 1', '하객 2', '하객 3', '하객 4', '하객 5', '하객 6']
  const cv = document.getElementById('c')
  const ctx = cv.getContext('2d')
  const mode = location.hash.slice(1) || 'preview'
  const GRASS = '#bfe3a0'
  const PAPER = '#f6f1e7'
  const INK = '#4a3f55'
  const put = (kind, dir, frame, scale, x, y) => ctx.drawImage(N.getSprite(kind, dir, frame, scale), Math.round(x), Math.round(y))
  const text = (s, x, y, size = 15, color = INK, align = 'left') => {
    ctx.fillStyle = color
    ctx.font = `600 ${size}px -apple-system, "Apple SD Gothic Neo", sans-serif`
    ctx.textAlign = align
    ctx.fillText(s, x, y)
  }
  const base = { skin: 1, hairStyle: 0, hairColor: 1, outfit: 2, outfitColor: 5, accessory: 0 }

  if (mode === 'walk') {
    const S = 3, W = N.NEMO_W * S, H = N.NEMO_H * S
    const LEFT = 96, ROW = 270
    cv.width = 1560
    cv.height = 60 + CAST.length * ROW
    ctx.fillStyle = PAPER
    ctx.fillRect(0, 0, cv.width, cv.height)
    DIRS.forEach((d, i) => text(`${d}  ·  frame 0 / 1 / 2`, LEFT + i * 3 * W + 1.5 * W, 34, 17, INK, 'center'))
    CAST.forEach((kind, r) => {
      const y = 50 + r * ROW
      text(NAMES[r], 14, y + 70, 17)
      text('x3', 14, y + 92, 12, '#9a8fa6')
      // 지도 크기: 풀밭 위에 x2(84px) 와 x1(42px)
      ctx.fillStyle = GRASS
      ctx.fillRect(LEFT, y + H + 6, 12 * W, 100)
      text('x2 · x1', 14, y + H + 60, 12, '#9a8fa6')
      DIRS.forEach((d, i) =>
        [0, 1, 2].forEach((f) => {
          const x = LEFT + (i * 3 + f) * W
          put(kind, d, f, S, x, y)
          put(kind, d, f, 2, x + 6, y + H + 6 + 100 - N.NEMO_FOOT_Y * 2 - 6)
          put(kind, d, f, 1, x + 74, y + H + 6 + 100 - N.NEMO_FOOT_Y - 6)
        }),
      )
    })
  } else if (mode === 'strip') {
    const CW = 150, CH = 150, S = 3.4
    cv.width = CAST.length * CW
    cv.height = WALK.length * DIRS.length * CH
    WALK.forEach((f, b) => {
      DIRS.forEach((d, r) => {
        const y0 = (b * DIRS.length + r) * CH
        ctx.fillStyle = r % 2 ? '#b5dc96' : GRASS
        ctx.fillRect(0, y0, cv.width, CH)
        CAST.forEach((kind, c) => {
          const sprite = N.getSprite(kind, d, f, S)
          ctx.fillStyle = 'rgba(40,60,30,0.22)'
          ctx.beginPath()
          ctx.ellipse(c * CW + CW / 2, y0 + CH - 9, 30, 6, 0, 0, Math.PI * 2)
          ctx.fill()
          ctx.drawImage(sprite, Math.round(c * CW + (CW - sprite.width) / 2), Math.round(y0 + CH - 8 - N.NEMO_FOOT_Y * S))
        })
      })
    })
  } else {
    const S = 2.6, W = N.NEMO_W * S, H = N.NEMO_H * S
    cv.width = 1180
    cv.height = 760
    ctx.fillStyle = PAPER
    ctx.fillRect(0, 0, cv.width, cv.height)
    const row = (title, y, kinds, labels) => {
      text(title, 16, y + 16, 14)
      kinds.forEach((k, i) => {
        put(k, 'down', 0, S, 12 + i * (W - 22), y + 22)
        if (labels) text(labels[i], 12 + i * (W - 22) + W / 2, y + 22 + H + 12, 10.5, '#7d7289', 'center')
      })
    }
    const parts = Object.fromEntries(N.PART_DEFS.map((p) => [p.key, p.options.map((o) => o.label)]))
    row('머리 모양', 4, parts.hairStyle.map((_, i) => ({ ...base, hairStyle: i, hairColor: i % 4 })), parts.hairStyle)
    row('의상', 152, parts.outfit.map((_, i) => ({ ...base, hairStyle: i % 2 ? 9 : 4, outfit: i, outfitColor: (i * 5) % 12 })), parts.outfit)
    row('액세서리', 300, parts.accessory.map((_, i) => ({ ...base, hairStyle: i === 9 ? 11 : 7, outfit: i === 9 ? 1 : 4, outfitColor: 0, accessory: i })), parts.accessory)
    row('피부 · 머리 색 · 옷 색', 448, [
      ...parts.skin.map((_, i) => ({ ...base, skin: i, hairStyle: 3, outfit: 3, outfitColor: 2 })),
      ...[2, 4, 6, 8, 9, 11].map((c, i) => ({ ...base, hairStyle: 5, hairColor: c, outfit: 7, outfitColor: [0, 3, 4, 6, 9, 10][i] })),
    ])
    text('신랑 · 신부 — 앞 / 옆 / 뒤 / 걷기', 16, 612, 14)
    ;[
      ['groom', 'down', 0], ['bride', 'down', 0], ['groom', 'right', 1], ['bride', 'right', 1], ['groom', 'left', 2], ['bride', 'left', 2],
      ['groom', 'up', 0], ['bride', 'up', 0], ['groom', 'down', 1], ['bride', 'down', 2],
    ].forEach(([k, d, f], i) => put(k, d, f, S, 12 + i * (W + 4), 620))
  }
</script>
